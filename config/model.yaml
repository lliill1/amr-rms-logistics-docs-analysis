# Справочник модели логистики (версия 2).
# Используется при извлечении процессов, обменов и границ ответственности, при поиске
# противоречий и при построении схем. Править можно без изменения кода.

# Системы и участники. Ключ — каноническое название (так оно будет в схемах и отчёте),
# aliases — как система может называться в документах (нижний регистр, можно начало слова).
# tier — «этаж» на схеме взаимодействия систем: 0 — верх (ERP), 3 — низ (роботы, автоматика).
systems:
  ERP:
    aliases: [erp, "s/4hana", s4hana, "sap erp", "1с:erp", "учётная система"]
    tier: 0
  MES:
    aliases: [mes, "система управления производством"]
    tier: 1
  SAP EWM:
    aliases: [ewm, "sap ewm", "extended warehouse", "складская система sap"]
    tier: 1
  WMS:
    aliases: [wms]
    tier: 1
  RMS:
    aliases: [rms, "система управления роботами", "fleet manager", "менеджер парка", "fleet management"]
    tier: 2
  Оператор:
    aliases: [оператор, кладовщик, водитель, мастер, персонал, сотрудник]
    tier: 2
  AMR:
    aliases: [amr, agv, робот, "мобильный робот", тележка]
    tier: 3
  PLC / автоматика:
    aliases: [plc, плк, контроллер, автоматика, scada, ворота, лифт]
    tier: 3
  Другое:
    aliases: []
    tier: 1

# Функции, по которым строится матрица ответственности «функция × система».
# required: true — если ни в одном документе не сказано, какая система отвечает
# за функцию, сервис покажет пробел и предложит вопрос заказчику.
functions:
  initiate_transport:
    title: Формирование транспортного задания
    required: true
  assign_robot:
    title: Назначение робота на задание
    required: true
  route_traffic:
    title: Маршрутизация и управление движением
    required: true
  task_priority:
    title: Приоритизация заданий
    required: false
  cargo_identification:
    title: Идентификация груза (HU, штрихкод)
    required: true
  confirm_delivery:
    title: Подтверждение выполнения перевозки
    required: true
  inventory_posting:
    title: Учёт перемещения запасов (проводка)
    required: true
  charging:
    title: Управление зарядкой роботов
    required: true
  doors_lifts:
    title: Взаимодействие с воротами и лифтами
    required: false
  exception_handling:
    title: Обработка ошибок и исключений
    required: true
  material_demand:
    title: Формирование потребности в материале
    required: false

# Роль роботов в процессе.
amr_roles: [роботизирован, планируется, обсуждается, вручную]

# Обмены, без которых роботизированная логистика не заработает. Если в документах
# нет ни одного обмена между a и любой из систем b — это пробел.
# need_protocol: true — пробел и тогда, когда обмен есть, но протокол не указан.
required_links:
  - title: Обмен RMS с учётной системой (задания и статусы)
    a: RMS
    b: [SAP EWM, MES, ERP, WMS]
  - title: Обмен RMS с роботами
    a: RMS
    b: [AMR]
    need_protocol: true
