# Доменный глоссарий. Используется для:
#  - оценки релевантности документа теме AMR/RMS;
#  - отбора фрагментов для извлечения требований;
#  - расширения поисковых запросов синонимами.
# Термины пишутся в нижнем регистре; можно указывать начало слова (основу):
# "робот" найдёт "роботы", "роботизированный" и т. д.
# weight — вклад одного упоминания в оценку релевантности.

groups:
  robots:
    title: Мобильные роботы
    weight: 3
    terms: [amr, agv, "мобильн робот", робот, роботиз, автономн транспорт, "беспилотн тележ", тягач, "робот-тележ"]

  rms:
    title: Система управления роботами
    weight: 3
    terms: [rms, "fleet manager", "fleet management", "система управления роботами", "управлени парком", "vda 5050", vda5050]

  transport:
    title: Транспортные задания
    weight: 2
    terms: ["транспортн задани", "транспортн заказ", "складск задач", "warehouse task", "warehouse order", "задани на перемещ", "заявк на перемещ", "внутрицехов", "межцехов", подвоз, "подач материал", "вывоз тары"]

  ewm:
    title: SAP EWM
    weight: 1
    terms: [ewm, "extended warehouse", mfs, "material flow system", "складск ячейк", "storage bin", "handling unit", "ppf", "psa", "зона подачи", "зона снабжен"]

  erp_mes:
    title: ERP / MES
    weight: 1
    terms: [erp, "s/4hana", s4hana, mes, "производственн заказ", "заказ на производств", "рабочее место", "участок"]

  infra:
    title: Инфраструктура для роботов
    weight: 1
    terms: [ворот, лифт, "зарядн станц", зарядк, "зона безопасн", "лидар", "навигац", "маршрут"]

# Синонимы для поиска: если в вопросе встречается ключ, к запросу добавляются значения.
synonyms:
  "транспортное задание": ["складская задача", "warehouse task", "WT", "задание на перемещение"]
  "amr": ["робот", "AGV", "мобильный робот"]
  "rms": ["система управления роботами", "fleet manager"]
  "ewm": ["SAP EWM", "склад"]
